- name: Hello World Test
  hosts: all
  roles:
    - e2e.tests.skupper_test_images
  vars:
    test_identifier: "HelloWorld"
  tasks:
    - name: "[ {{ test_identifier }} ] - Main task block"
      block:
        - name: "[ {{ test_identifier }} - Setup ] Environment shakeout"
          ansible.builtin.include_role:
            name: e2e.tests.env_shakeout

        - name: "[ {{ test_identifier }} - Setup ] Generating the namespaces"
          ansible.builtin.include_role:
            name: e2e.tests.generate_namespaces

        - name: "[ {{ test_identifier }} - Setup ] Create Skupper resources for west site"
          include_tasks: skupper-sites.yml
          vars:
            site_name: west

        - name: "[ {{ test_identifier }} - Setup ] Create Skupper resources for east site"
          include_tasks: skupper-sites.yml
          vars:
            site_name: east

        - name: "[ {{ test_identifier }} - Setup ] Issue a Skupper access token from west namespace"
          skupper.v2.token:
            namespace: "{{ namespace_prefix }}-{{ namespace_name }}"
            name: west-grant
            redemptions_allowed: 1
            kubeconfig: "{{ kubeconfig }}"
          register: west
          when:
            - "'west' in inventory_hostname"

        - name: "[ {{ test_identifier }} - Setup ] Apply token to east site"
          skupper.v2.resource:
            def: "{{ hostvars['west']['west']['token'] }}"
            namespace: "{{ namespace_prefix }}-{{ namespace_name }}"
            kubeconfig: "{{ kubeconfig }}"
          when:
            - "'east' in inventory_hostname"

        - name: "[ {{ test_identifier }} - RunTest ] Testing the connectivity between the sites"
          ansible.builtin.include_role:
            name: e2e.tests.run_curl
          when:
            - "'west' in inventory_hostname"

      always:
        - name: "[ {{ test_identifier }} - Teardown ] Deleting the namespaces"
          kubernetes.core.k8s:
            state: absent
            api_version: v1
            kind: Namespace
            label_selectors:
              - "e2e.id={{ generate_namespaces_namespace_label }}"
            kubeconfig: "{{ kubeconfig }}"
          when:
            - not skip_teardown | default(false) | bool
